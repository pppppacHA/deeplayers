<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">

<title>가입 · 공중도시 DEEP LAYER</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 64 64&quot;%3E%3Crect width=&quot;64&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;#161616&quot;/%3E%3Cg transform=&quot;translate%2832 32%29 scale%280.05136 -0.05136%29 translate%28-373.0 -350.0%29&quot;%3E%3Cpath fill=&quot;#ffffff&quot; d=&quot;M446 0H67V10H80Q106 10 124.5 28.5Q143 47 144 73V644Q39 633 -15 585Q-61 544 -89 480L-99 484Q-79 592 4.5 646.0Q88 700 214 700H446Q634 700 739.5 607.5Q845 515 845.0 350.0Q845 185 739.0 92.5Q633 0 446 0ZM349 50H426Q426 50 426 50Q519 50 572.0 129.5Q625 209 625.0 350.0Q625 491 572.0 570.5Q519 650 426 650L349 648Z&quot;/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/signup.css">
</head>
<body data-theme="light" class="signup-body">
<main class="signup-card" aria-labelledby="suTitle">
  <div class="brand"><small>공중도시</small><em>DEEP LAYER</em></div>
  <div class="su-tabs hidden" id="suTabs" role="tablist"><button type="button" class="active" data-su="signup" role="tab">가입</button><button type="button" data-su="login" role="tab">로그인</button></div>
  <h1 id="suTitle">탐색자 등록</h1>
  <p class="tiny">초대코드가 있어야 가입할 수 있어요.</p>
  <form id="liForm" class="hidden" autocomplete="on" novalidate>
    <label class="su-field"><span>아이디</span><input id="liId" maxlength="16" autocomplete="username" spellcheck="false"></label>
    <label class="su-field"><span>비밀번호</span><input id="liPw" type="password" maxlength="64" autocomplete="current-password"></label>
    <button class="primary su-submit" id="liGo" type="submit">로그인</button>
    <div class="su-result" id="liResult" role="status" aria-live="polite"></div>
  </form>
  <form id="suForm" autocomplete="off" novalidate>
    <label class="su-field"><span>아이디</span>
      <input id="suId" maxlength="16" autocomplete="username" spellcheck="false" placeholder="영문 소문자·숫자·_ 4~16자">
      <small class="su-msg" id="suIdMsg"></small></label>
    <label class="su-field"><span>비밀번호</span>
      <input id="suPw" type="password" maxlength="64" autocomplete="new-password" placeholder="10자 이상, 영문+숫자 포함">
      <small class="su-hint">다른 사이트나 다른 페이지에서 쓰는 비밀번호와 <b>다른 것</b>을 만들어 주세요.</small>
      <span class="su-meter" aria-hidden="true"><i id="suMeter"></i></span><small class="su-msg" id="suPwMsg"></small></label>
    <label class="su-field"><span>비밀번호 확인</span>
      <input id="suPw2" type="password" maxlength="64" autocomplete="new-password">
      <small class="su-msg" id="suPw2Msg"></small></label>
    <label class="su-field"><span>초대코드</span>
      <input id="suInv" maxlength="32" autocomplete="off" spellcheck="false" placeholder="초대코드 입력">
      <small class="su-msg" id="suInvMsg"></small></label>
    <label class="switch su-check"><span>다른 곳에서 쓰는 비밀번호와 다릅니다</span><input id="suOther" type="checkbox" role="switch"><i></i></label>
    <button class="primary su-submit" id="suGo" type="submit">가입하기</button>
    <div class="su-result" id="suResult" role="status" aria-live="polite"></div>
  </form>
  <a class="su-back" id="suBack" href="index.html">← 게임으로 돌아가기</a>
  <p class="tiny su-note">이 페이지는 서버 연결 전 데모입니다. 가입 정보는 이 브라우저에만 저장되며(비밀번호는 PBKDF2 해시), 초대코드 인원 제한도 이 브라우저에서만 셉니다. 실서비스에서는 서버가 검증·집계해야 합니다. (SECURITY.md)</p>
</main>
<script src="js/cloud.js"></script>
<script src="js/auth.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
