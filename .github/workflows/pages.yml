# main 브랜치에 푸시하면 GitHub Pages로 자동 배포합니다. (tools/, tests/ 등 개발용 파일은 올리지 않습니다)
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포 폴더 만들기
        run: |
          mkdir _site
          cp -r index.html signup.html favicon.ico favicon.svg favicon-32.png apple-touch-icon.png css js audio _site/
          cp -r assets _site/assets  && rm -f _site/assets/room/README.md _site/assets/room/_guide_room.png _site/assets/room/.gitkeep
          touch _site/.nojekyll
          echo "{\"v\":\"${GITHUB_SHA}\"}" > _site/version.json
          # 캐시 무효화: 스크립트/스타일 주소 뒤에 배포 번호를 붙인다 (그냥 F5로도 새 버전이 적용된다)
          V=${GITHUB_SHA::8}
          sed -i -E "s#(src|href)=\"((js|css)/[^\"?]+\.(js|css))\"#\1=\"\2?v=${V}\"#g" _site/index.html _site/signup.html
          sed -i -E "s#href=\"((favicon[^\"?]*)|apple-touch-icon\.png)\"#href=\"\1?v=${V}\"#g" _site/index.html _site/signup.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
