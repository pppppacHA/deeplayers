<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 보안: 인라인/외부 스크립트 실행 차단, 허용된 폰트 외 외부 연결 차단 (SECURITY.md 참고) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>공중도시 DEEP LAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Cinzel+Decorative:wght@700;900&family=Nanum+Myeongjo:wght@700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
<div class="app">

  <header class="topbar">
    <div class="brand-block">
      <div class="brand"><small>공중도시</small><em>DEEP LAYER</em></div>
      <div class="world-meta">
        <span><span class="material-symbols-rounded" aria-hidden="true">schedule</span><b id="clock"></b></span>
        <span title="오늘의 날씨"><span class="material-symbols-rounded" id="hdWeatherIc" aria-hidden="true">partly_cloudy_day</span><span id="hdWeather">맑음</span></span>
        <span title="계절"><span class="material-symbols-rounded" id="hdSeasonIc" aria-hidden="true">calendar_month</span><span id="hdSeason">가을 · 12일차</span></span>
        <span title="현재 고도"><span class="material-symbols-rounded" aria-hidden="true">my_location</span><span id="hdAlt">고도 8,420m</span></span>
      </div>
    </div>
    <nav class="top-actions">
      <button title="공지" data-board="공지"><span class="material-symbols-rounded" aria-hidden="true">notifications</span></button>
      <button title="가이드" data-board="가이드"><span class="material-symbols-rounded" aria-hidden="true">question_mark</span></button>
      <button title="버그 리포트" id="bugBtn"><span class="material-symbols-rounded" aria-hidden="true">bug_report</span></button>
      <button title="세계관" data-board="세계관"><span class="material-symbols-rounded" aria-hidden="true">public</span></button>
      <button title="설정" id="settingsBtn"><span class="material-symbols-rounded" aria-hidden="true">settings</span></button>
      <button title="로그아웃" class="logout" id="logoutBtn"><span class="material-symbols-rounded" aria-hidden="true">logout</span></button>
    </nav>
  </header>

  <main class="layout" id="layout">

    <!-- 왼쪽 컬럼: 프로필 / 스테이터스 / 장비·인벤토리·제작 -->
    <aside class="column left-column">
      <section class="panel profile-panel">
        <div class="buff-icons" id="buffIcons"></div>
        <div class="profile">
          <div class="profile-head">
            <button class="avatar empty" id="avatarButton" title="프로필 보기"></button>
            <input type="file" id="avatarFile" accept="image/*" class="hidden">
            <div class="charinfo">
              <div class="title-chip" id="titleChip"></div>
              <div class="charname"><span id="charName"></span></div>
              <div class="char-meta" id="charMeta"></div>
              <div class="char-tags" id="charTags"></div>
              <div class="char-job" id="charJob"></div>
            </div>
          </div>
          <div class="quick">
            <button title="메일함" data-system="메일"><span class="material-symbols-rounded" aria-hidden="true">mail</span></button>
            <button title="친구" data-system="친구"><span class="material-symbols-rounded" aria-hidden="true">person_add</span></button>
            <button title="길드" data-system="길드"><span class="material-symbols-rounded" aria-hidden="true">groups</span></button>
            <button title="도감" data-system="도감"><span class="material-symbols-rounded" aria-hidden="true">menu_book</span></button>
            <div class="wallet" title="소지금"><span class="material-symbols-rounded" aria-hidden="true">monetization_on</span><strong id="money"></strong><em>CR</em></div>
          </div>
          <div class="bars" id="bars"></div>
        </div>
      </section>

      <section class="panel status-panel" data-panel="상태">
        <div class="panel-title"><span class="material-symbols-rounded" aria-hidden="true">bar_chart</span> 스테이터스 <span class="spacer"></span><span class="status-pager" id="statusPager"><button data-act="status-page" data-p="0" class="on" title="능력치">1</button><button data-act="status-page" data-p="1" title="전투 능력">2</button><button data-act="status-page" data-p="2" title="숙련">3</button></span><span class="point-badge hidden" id="statPoints"></span><span class="stat-save hidden" id="statSave"><button data-act="stat-commit" class="primary">저장</button><button data-act="stat-reset">취소</button></span></div>
        <div id="statusBody"></div>
      </section>

      <section class="panel tabs-panel" data-panel="소지품">
        <div class="panel-title"><span class="material-symbols-rounded" aria-hidden="true" id="leftTitleIcon">backpack</span> <span id="leftTitle">장비</span> <span class="spacer"></span><span class="title-meta" id="leftMeta"></span></div>
        <div class="tabs" id="leftTabs">
          <button class="active" data-ltab="EQUIP">장비</button>
          <button data-ltab="INVENTORY">소지품</button>
          <button data-ltab="CRAFT">제작</button>
        </div>
        <div class="tab-view" id="viewEquip">
          <div class="equip-wrap">
            <div><div class="buffs" id="equipFx"></div><div class="equip-grid" id="equipGrid"></div></div>
            <div class="equip-big" id="equipBig"></div>
          </div>
          <div class="equip-pick" id="equipPick"></div>
        </div>
        <div class="tab-view hidden" id="viewInv">
          <div class="inventory-head">
            <div class="subtabs" id="invTabs">
              <button data-inv="장비">장비</button>
              <button data-inv="소모품">소모품</button>
              <button data-inv="재료">재료</button>
            </div>
          </div>
          <div class="inv-scroll"><div class="inv-grid" id="inventoryGrid"></div></div>
          <div class="inv-footer">
            <span class="inv-count" id="itemCount" title="가진 아이템 칸 / 소지 가능 칸"></span>
            <div class="pages">
              <button id="prevPage" title="이전 페이지"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></button>
              <span id="invPage">1 / 1</span>
              <button id="nextPage" title="다음 페이지"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button>
            </div>
          </div>
        </div>
        <div class="tab-view hidden" id="viewCraft">
          <div class="subtabs" id="craftTabs"><button data-craft="장비">장비</button><button data-craft="음식">음식</button><button data-craft="약">약</button><button data-craft="재료">재료</button></div>
          <div class="craft-head"><span id="craftCount">레시피</span><button type="button" class="chip" id="craftOnly" aria-pressed="false">제작 가능만</button></div>
          <div id="craftList"></div>
        </div>
      </section>
    </aside>

    <!-- 중앙 컬럼: 지도 / 구역 활동 / 로그 -->
    <section class="column center-column">
      <section class="panel map-panel" data-panel="지도">
        <div class="map-head" id="mapHead">
          <div class="map-emblem"><span class="material-symbols-rounded" id="mapIcon" aria-hidden="true">map</span></div>
          <div class="map-info"><h2 id="mapLocation"></h2><p id="mapDescription"></p></div>
          <div class="map-meta" id="mapMeta"></div>
        </div>
        <div class="map-body">
        <div class="map-stage" id="mapStage">
          <div class="map-search"><input id="mapSearch" type="search" maxlength="12" placeholder="재료·몬스터 검색 (예: 목재, 늑대)" aria-label="지도에서 재료와 몬스터 검색" autocomplete="off"><span id="mapSearchInfo"></span></div>
          <div class="map-world" id="mapWorld"></div>
          <div class="map-tools">
            <button class="icon" id="zoomIn" title="확대"><span class="material-symbols-rounded" aria-hidden="true">add</span></button>
            <button class="icon" id="zoomOut" title="축소"><span class="material-symbols-rounded" aria-hidden="true">remove</span></button>
            <button class="icon" id="resetMap" title="중앙 정렬"><span class="material-symbols-rounded" aria-hidden="true">center_focus_strong</span></button>
            <button class="icon" id="mapHelp" data-tip-title="지도 사용법" data-tip-desc="마우스 휠(가운데) 버튼을 누른 채 끌기: 지도 이동 — 던전 타일 지도에서도 가능 (터치는 그냥 끌기) · 노드 선택: 구역 이동 (이동에는 기력이 듭니다)" aria-label="지도 도움말"><span class="material-symbols-rounded" aria-hidden="true">help</span></button>
          </div>
                    <div class="compass"><span class="north">N</span><span class="west">W</span><span class="needle"></span><span class="east">E</span><span class="south">S</span></div>
        </div>
        <div class="map-log">
          <div class="map-log-head"><span class="map-log-label">LOG</span><button class="flat" id="clearLog" title="기록 비우기"><span class="material-symbols-rounded" aria-hidden="true">delete_sweep</span></button></div>
          <div class="scroll log-list" id="logList"></div>
        </div>
        </div>
      </section>

      <section class="panel action-panel" id="actionPanel" data-panel="구역 활동">
        <div class="action-main" id="actionMain"></div>
        <div class="choices" id="choices"></div>
      </section>
    </section>

    <!-- 오른쪽 컬럼: 임무·주위 대원 / 채팅 -->
    <aside class="column right-column">
      <section class="panel quest-panel" data-panel="임무 · 주변">
        <div class="panel-title"><span class="material-symbols-rounded" aria-hidden="true" id="rightTitleIcon">assignment</span> <span id="rightTitle">임무</span> <span class="spacer"></span><span class="title-meta" id="rightMeta"></span></div>
        <div class="tabs">
          <button class="active" data-side="임무">임무</button>
          <button data-side="서브잡" id="sideJobTab" class="hidden">서브잡</button>
          <button data-side="펫" id="sidePetTab" class="hidden">펫</button>
          <button data-side="상황">상황</button>
        </div>
        <div class="scroll right-view" id="sideView"></div>
      </section>

      <section class="panel chat-panel terminal" data-panel="채팅">
        <div class="device-head"><span class="device-light"></span><strong>TACTICAL LINK</strong><span class="term-sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="term-ch">SECURE CHANNEL</span></div>
        <div class="term-screen">
          <div class="tabs">
            <button class="active" data-chat="월드">월드</button>
            <button data-chat="길드">길드</button>
            <button data-chat="파티">파티</button>
            <button data-chat="알림">알림</button>
          </div>
          <div class="chan-bar hidden" id="guildBar"></div>
          <button class="notice-banner hidden" id="noticeBanner" data-act="open-patch"><span class="material-symbols-rounded" aria-hidden="true">campaign</span><span>변경 사항이 있습니다. 눌러서 패치노트 보기</span></button>
          <div class="scroll chat-feed" id="chatFeed"></div>
          <div class="sticker-tray hidden" id="stickerTray"></div>
          <p class="readonly-note hidden" id="noticeNote">알림 채널은 공지만 받을 수 있어요. 글을 쓸 수 없습니다.</p>
          <form class="chat-compose" id="chatForm" autocomplete="off">
            <button type="button" id="emojiBtn" title="이모티콘"><span class="material-symbols-rounded" aria-hidden="true">mood</span></button><button type="button" id="diceBtn" title="주사위 굴리기 (1~6)" aria-label="주사위 굴리기"><span class="material-symbols-rounded" aria-hidden="true">casino</span></button>
            <input id="noticeHead" class="hidden" maxlength="20" list="noticeHeads" placeholder="말머리" aria-label="공지 말머리"><datalist id="noticeHeads"><option value="서버 공지"><option value="점검 일정"><option value="업데이트"><option value="이벤트"><option value="안내"></datalist>
            <input id="chatInput" maxlength="300" placeholder="암호화 메시지 입력...">
            <button class="primary" title="전송"><span class="material-symbols-rounded" aria-hidden="true">send</span></button>
          </form>
        </div>
        <div class="term-foot" aria-hidden="true"><i></i><i></i><i></i><span>DL-TERMINAL</span></div>
      </section>
    </aside>

  </main>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-head"><span class="material-symbols-rounded" aria-hidden="true">web_asset</span><h2 id="modalTitle"></h2><button class="icon" id="closeModal" aria-label="닫기"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="tutorial hidden" id="tutorial">
  <div class="tut-story hidden" id="tutStory"><button class="flat tut-cloud hidden" id="tutCloudLoad" type="button">서버 불러오기</button><div class="tut-story-inner">
    <div class="tut-npc hidden" id="tutNpc"></div>
    <p id="tutText"></p>
    <div class="tut-gift hidden" id="tutGift"><span class="material-symbols-rounded" aria-hidden="true">tablet_android</span><small>탐색자 단말기를 받았다</small></div>
    <div class="tut-actions"><button class="flat" id="tutSkipStory">건너뛰기</button><button class="primary" id="tutNextStory">다음</button></div>
    <div class="tut-dots" id="tutDots"></div>
  </div></div>
  <div class="tut-create hidden" id="tutCreate"><div class="tut-box">
    <div class="tut-box-head" id="tutCreateHead"></div>
    <div class="tut-box-body" id="tutCreateBody"></div>
    <div class="tut-box-actions" id="tutCreateActions"></div>
  </div></div>
  <div class="tut-create hidden" id="tutWeapon"><div class="tut-box">
    <div class="tut-box-head" id="tutWeaponHead"></div>
    <div class="tut-box-body"><p class="npc-say" id="tutWeaponSay"></p><div class="weapon-list" id="tutWeaponList"></div></div>
    <div class="tut-box-actions"><button class="primary" id="tutWeaponOk" disabled>이 무기로 정할게요</button></div>
  </div></div>
  <div class="tut-spot hidden" id="tutSpot"></div>
  <div class="tut-card hidden" id="tutCard"><div class="tut-step" id="tutStep"></div><h3 id="tutTitle"></h3><p id="tutBody"></p><div class="tut-actions"><button class="flat" id="tutSkip">건너뛰기</button><span class="spacer"></span><button id="tutPrev">이전</button><button class="primary" id="tutNext">다음</button></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/cloud.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
